name: Eko
options:
  bundleIdPrefix: com.eko
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  EkoCorePackage:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGN_STYLE: Automatic
targets:
  Eko:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources
      # XcodeGen has no target-level `resources:` key — resource files must be
      # sources entries with buildPhase: resources, or they silently never make
      # it into the bundle (no app icon, LocalizedStringKey lookups render raw).
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: EkoCorePackage
        product: EkoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eko.mac
        PRODUCT_NAME: Eko
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Eko.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: NO
        LSUIElement: YES
  EkoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/EkoTests
    dependencies:
      - target: Eko
      - package: EkoCorePackage
        product: EkoCore
      - package: GRDB
        product: GRDB
      - package: Yams
        product: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eko.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Eko.app/Contents/MacOS/Eko"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Eko:
    build:
      targets:
        Eko: all
        EkoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EkoTests
    archive:
      config: Release
