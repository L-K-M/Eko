format: eko-otp-corpus-v1
license: CC0-1.0
provenance: Clean-room synthetic multilingual cases written for Eko without consulting third-party extractor source code.
defaults:
  omitted_text_field: null
  omitted_array_field: []
  is_group_summary: false
  source: sms
