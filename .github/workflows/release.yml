# CD: tag-triggered release. scripts/release.sh moves the version in lockstep
# across android/app/build.gradle.kts (versionName + an auto-incremented
# versionCode) and macos/project.yml (MARKETING_VERSION + CURRENT_PROJECT_VERSION),
# updates the README marker, commits, tags vX.Y.Z, and with --push pushes branch
# + tag — the tag push lands here, which:
#
#   - re-proves the tagged commit by calling ci.yml in full. A v* tag can land
#     on any commit, including one CI never saw, and the release feed is the
#     update channel for a sideloaded app: a broken release is a broken updater.
#   - asserts the tag matches BOTH committed versions. Two version files means
#     two ways to ship a release named v1.5.0 containing something else.
#   - builds each platform, signing when that platform's secrets are configured
#     and falling back when they are not, the same as the sibling repos. The
#     fallbacks are not equivalent, and the release notes say so per artifact:
#     an ad-hoc signed .app runs behind a Gatekeeper warning, an unsigned APK
#     cannot be installed at all until someone signs it.
#   - publishes SHA-256 checksums next to every artifact, and verifies the
#     signatures it produced (apksigner --print-certs, stapler validate,
#     spctl --assess) rather than assuming the signing step worked.
#
# Configure the secrets in CICD.md's table and every subsequent tag upgrades
# itself to the signed path with no workflow change. Do that before the first
# public Android release in particular: the signing certificate is also the
# upgrade identity, and a differently signed APK cannot update an installed Eko.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the artifacts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Re-prove the tagged commit
    uses: ./.github/workflows/ci.yml

  version:
    name: Match tag to committed versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag against both version files
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Tolerant patterns (flexible spacing, optional quotes, trailing
          # comments): the gate must accept everything scripts/release.sh can
          # produce, or a valid bump fails the release it just cut.
          ANDROID="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]*)".*$/\1/p' android/app/build.gradle.kts | head -n 1)"
          MACOS="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' macos/project.yml | head -n 1)"

          echo "tag=$VERSION android=$ANDROID macos=$MACOS"
          status=0
          [ -n "$ANDROID" ] || { echo "::error::could not read versionName from android/app/build.gradle.kts"; status=1; }
          [ -n "$MACOS" ] || { echo "::error::could not read MARKETING_VERSION from macos/project.yml"; status=1; }
          if [ "$VERSION" != "$ANDROID" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${ANDROID} in android/app/build.gradle.kts — cut releases with scripts/release.sh so they stay in step."
            status=1
          fi
          if [ "$VERSION" != "$MACOS" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${MACOS} in macos/project.yml — cut releases with scripts/release.sh so they stay in step."
            status=1
          fi
          exit "$status"

  android:
    name: Android APK
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the signing path
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=()
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); else present+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${#present[@]}" -eq 0 ]; then
            echo "::warning::No Android signing secrets configured; attaching the unsigned release APK, which cannot be installed until it is signed. See CICD.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            # Half a keystore configuration is a misspelled secret name, not a
            # decision to publish something nobody can install.
            echo "::error::Android signing is partially configured; missing secrets: ${missing[*]}. Set all four, or none."
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: android

      - name: Assemble the release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign, verify and checksum
        id: package
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -f "$UNSIGNED" ] || { echo "::error::release APK not found at $UNSIGNED"; exit 1; }
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"

          if [ "$SIGNED" != "true" ]; then
            OUT="$DIST/eko-$VERSION-unsigned.apk"
            cp "$UNSIGNED" "$OUT"
            ( cd "$DIST" && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256" )
            echo "dist=$DIST" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK_ROOT" ] || { echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set."; exit 1; }
          BUILD_TOOLS_DIRS=("$SDK_ROOT"/build-tools/*)
          [ -d "${BUILD_TOOLS_DIRS[0]}" ] || { echo "::error::No Android SDK Build Tools found under $SDK_ROOT."; exit 1; }
          BUILD_TOOLS="$(printf '%s\n' "${BUILD_TOOLS_DIRS[@]}" | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Selected Android SDK Build Tools are missing zipalign or apksigner: $BUILD_TOOLS"
            exit 1
          fi
          echo "Using Android SDK Build Tools ${BUILD_TOOLS##*/}."

          ALIGNED="$RUNNER_TEMP/aligned.apk"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT
          # Tolerate wrapped/whitespace-contaminated pastes (76-column base64,
          # CRs, copy artifacts) — only genuinely invalid base64 still fails.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEYSTORE" 2>/dev/null \
             || [ ! -s "$KEYSTORE" ]; then
            # Portable encode: -w0 is GNU-only and errors out on macOS's BSD
            # base64, which is where this secret actually gets created.
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 even after stripping whitespace. Re-create it with: base64 < release.jks | tr -d '\n'"
            exit 1
          fi

          OUT="$DIST/eko-$VERSION.apk"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$OUT" "$ALIGNED"
          # The certificate digest is the upgrade identity; print it into the log
          # so it can be compared against the release record (docs/release-checklists.md).
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          ( cd "$DIST" && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256" )
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      - name: Write the Android release notes
        id: notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/android-notes.md"
          if [ "$SIGNED" = "true" ]; then
            cat > "$NOTES" <<'EOF'
          ### Android

          Sideload the `.apk`, or point Obtainium at this repository. The APK is
          signed with Eko's release key; the signer certificate digest is in the
          release workflow log. Verify your download against the `.sha256` file.
          EOF
          else
            cat > "$NOTES" <<'EOF'
          ### Android — unsigned

          This APK is **unsigned** and cannot be installed as-is: Android rejects
          an APK with no signature, and the signing certificate is also the
          upgrade identity, so signing it yourself creates an app that can never
          be updated by an official release. Treat it as a reproducible build
          artifact, not a download.
          EOF
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Eko ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          append_body: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.package.outputs.dist }}/*.apk
            ${{ steps.package.outputs.dist }}/*.sha256

  macos:
    name: macOS app
    needs: [ci, version]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP_NAME: Eko
      KEYCHAIN_PROFILE: eko-notary
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the signing path
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          present=()
          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            AC_API_KEY_BASE64 \
            AC_API_KEY_ID \
            AC_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); else present+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${#present[@]}" -eq 0 ]; then
            echo "::warning::No Developer ID secrets configured; publishing an ad-hoc signed, un-notarized build. Gatekeeper will warn on first launch. See CICD.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS signing is partially configured; missing secrets: ${missing[*]}. Set all seven, or none."
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3" # keep in step with ci.yml and macos/project.yml

      - name: Install tooling
        run: brew install xcodegen create-dmg

      - name: Generate the Xcode project
        working-directory: macos
        run: ./Scripts/generate-project.sh

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/eko-signing.keychain-db"
          P12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$P12"' EXIT
          if ! printf '%s' "$DEVELOPER_ID_P12_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$P12" 2>/dev/null \
             || [ ! -s "$P12" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not valid base64 even after stripping whitespace."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$DEVELOPER_ID_P12_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Append to the search list rather than replacing it: notarytool stores
          # its credentials in the default (login) keychain, which must stay
          # reachable.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # codesign and exportArchive both accept the SHA-1 of the identity, so
          # the certificate's common name isn't a separate secret.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate. Ad-hoc or Apple Development certificates cannot be notarized."
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.signing.outputs.signed == 'true'
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          if ! printf '%s' "$AC_API_KEY_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEY" 2>/dev/null \
             || [ ! -s "$KEY" ]; then
            echo "::error::AC_API_KEY_BASE64 is not valid base64 even after stripping whitespace."
            exit 1
          fi
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID"

      # Archive on both paths, so the two differ only in how the app is signed —
      # not in how it was built. The hardened runtime comes from project.yml
      # (ENABLE_HARDENED_RUNTIME), which notarization requires and which a
      # Release archive must therefore already carry.
      - name: Archive (Developer ID)
        if: steps.signing.outputs.signed == 'true'
        working-directory: macos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Eko.xcodeproj -scheme Eko -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Eko.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Archive (unsigned)
        if: steps.signing.outputs.signed != 'true'
        working-directory: macos
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Eko.xcodeproj -scheme Eko -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Eko.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      # exportArchive does the inside-out signing the release checklist requires
      # (every nested framework signed by the expected Team ID before the outer
      # bundle) — which is exactly what `codesign --deep` does not do.
      - name: Export the Developer ID app
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Eko.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$RUNNER_TEMP/export"
          echo "APP_PATH=$RUNNER_TEMP/export/$APP_NAME.app" >> "$GITHUB_ENV"

      - name: Ad-hoc sign the archived app
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/Eko.xcarchive/Products/Applications/$APP_NAME.app" "$APP"
          # Inside-out by hand, for the same reason exportArchive does it on the
          # signed path: nested code must be sealed before the bundle that
          # contains it. Ad-hoc (identity "-") carries no trust, but it IS what
          # lets the bundle launch at all on Apple Silicon.
          while IFS= read -r nested; do
            echo "-- ad-hoc signing $nested"
            codesign --force --sign - "$nested"
          done < <(find "$APP/Contents" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.bundle' \))
          # Same hardened runtime and entitlements the Release configuration
          # would apply, so the fallback build behaves like the product rather
          # than like an unsandboxed variant of it.
          codesign --force --options runtime \
            --entitlements "$GITHUB_WORKSPACE/macos/Config/Eko.entitlements" \
            --sign - "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # The app must be notarized and stapled BEFORE it is copied into the
      # read-only DMG — stapling afterwards only reaches the loose copy, and
      # users who drag the app out of the DMG and first-launch offline would
      # hit a Gatekeeper warning for the missing ticket.
      - name: Notarize and staple the app
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize-app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" --keychain-profile "$KEYCHAIN_PROFILE" --wait
          xcrun stapler staple "$APP_PATH"

      - name: Package the disk image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          DMG="$DIST/$APP_NAME-$VERSION.dmg"
          STAGE="$(mktemp -d "$RUNNER_TEMP/dmg-source.XXXXXX")"
          # create-dmg copies the contents of its source directory. Passing the
          # bundle itself would put Contents/ at the image root instead of Eko.app.
          ditto "$APP_PATH" "$STAGE/$APP_NAME.app"
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --app-drop-link 390 185 \
            --skip-jenkins \
            "$DMG" "$STAGE"

          hdiutil verify "$DMG"
          MOUNT="$(mktemp -d "$RUNNER_TEMP/dmg-mount.XXXXXX")"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$MOUNT" "$DMG"
          cleanup_mount() { hdiutil detach -force "$MOUNT" >/dev/null 2>&1 || true; }
          detach_mount() {
            for delay in 1 2 4 8; do
              if hdiutil detach "$MOUNT"; then return 0; fi
              sleep "$delay"
            done
            hdiutil detach "$MOUNT"
          }
          trap cleanup_mount EXIT
          EXECUTABLE="$MOUNT/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          [ -x "$EXECUTABLE" ] || {
            echo "::error::DMG does not contain the executable at $APP_NAME.app/Contents/MacOS/$APP_NAME"
            exit 1
          }
          [ -L "$MOUNT/Applications" ] && [ "$(readlink "$MOUNT/Applications")" = "/Applications" ] || {
            echo "::error::DMG does not contain the expected /Applications link"
            exit 1
          }
          detach_mount
          trap - EXIT

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST=$DIST" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Sign the disk image
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"

      - name: Notarize and staple the disk image
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          # The app inside was stapled before packaging; the DMG gets its own
          # ticket. Stapling changes bytes — which is why the checksums are
          # computed after this step, never before.
          xcrun notarytool submit "$DMG" --keychain-profile "$KEYCHAIN_PROFILE" --wait
          xcrun stapler staple "$DMG"

      - name: Verify the signed bundle
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "$APP_PATH"
          # Notarization silently requires the hardened runtime and a secure
          # timestamp; a missing one only shows up as a Gatekeeper rejection on a
          # user's machine.
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | grep -E 'flags=.*runtime' \
            || { echo "::error::the signed bundle does not have the hardened runtime enabled"; exit 1; }
          codesign --display --entitlements :- "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG"
          hdiutil verify "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          # The real end-user check: Gatekeeper's own verdict.
          spctl --assess --type exec --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Verify the ad-hoc signed bundle
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          # An ad-hoc signature can't be stapled or assessed by Gatekeeper, but
          # it still verifies for internal consistency.
          codesign --verify --strict --verbose=2 "$APP_PATH"
          hdiutil verify "$DMG"

      - name: Package the archive and checksums
        id: package
        run: |
          set -euo pipefail
          ZIP="$DIST/$APP_NAME-$VERSION.zip"
          # ditto, not zip: the only archiver that preserves the bundle's
          # symlinks, resource forks and extended attributes, and therefore its
          # signature and stapled ticket.
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          ( cd "$DIST" && shasum -a 256 ./*.dmg ./*.zip > "$APP_NAME-$VERSION.sha256" )
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      - name: Write the macOS release notes
        id: notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/macos-notes.md"
          if [ "$SIGNED" = "true" ]; then
            cat > "$NOTES" <<'EOF'
          ### macOS

          Signed with a Developer ID certificate and notarized by Apple, so it
          opens without a Gatekeeper prompt. Move it to `/Applications` and keep
          one copy: duplicates confuse Local Network settings and login
          registration. Verify your download against the `.sha256` file.
          EOF
          else
            cat > "$NOTES" <<'EOF'
          ### macOS — unsigned (does not run)

          This build was produced without signing secrets and is a
          **reproducibility artifact, not a runnable app**. It carries only an
          ad-hoc signature, and Eko stores its identity key in the Data
          Protection Keychain, which an ad-hoc-signed app cannot access
          (`errSecMissingEntitlement`) — the app shows "Eko could not start"
          and exits, even after bypassing Gatekeeper. Use a signed release, or
          build and install locally with `scripts/build.sh --install`, which
          signs with an Apple Development identity and provisioning profile.
          EOF
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Eko ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          append_body: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.package.outputs.dist }}/*.dmg
            ${{ steps.package.outputs.dist }}/*.zip
            ${{ steps.package.outputs.dist }}/*.sha256

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
