android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 enables built-in Kotlin by default, which is incompatible with applying
# org.jetbrains.kotlin.android and org.jetbrains.kotlin.kapt. Opting out keeps
# the kapt-based Room setup working; the built-in Kotlin migration (kapt -> KSP,
# plugin removal) is deferred work and must land before AGP 10 drops the flag.
android.builtInKotlin=false
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
