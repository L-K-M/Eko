android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 enables built-in Kotlin by default, which is incompatible with applying
# the external org.jetbrains.kotlin.android plugin. Opting out keeps the
# existing plugin setup working; migrating to built-in Kotlin is deferred work
# and must land before AGP 10 drops the flag.
android.builtInKotlin=false
# AGP 9 also enables a new DSL which rejects the external kotlin-android plugin
# outright; this opt-out goes with the flag above and is removed in AGP 10 too.
android.newDsl=false
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
