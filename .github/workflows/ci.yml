# CI: prove every push to main and every PR across all four trees — the shared
# protocol artifacts, the Python reference model, the Android app, and the macOS
# app. release.yml calls this same workflow to re-prove a tagged commit.
#
# The protocol job runs first in spirit if not in order: a malformed schema or
# scenario surfaces as two unrelated-looking platform failures, because the
# Kotlin and Swift suites both consume those files.
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon or Swift build service
#     can't burn the 6-hour default

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml re-proves the tagged commit with this workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    name: Protocol artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only the checker needs these; tools/ is deliberately stdlib-only.
      - name: Install validator dependencies
        run: pip install --disable-pip-version-check jsonschema PyYAML

      - name: Validate schemas, vectors and the OTP corpus
        run: python3 scripts/check-protocol.py

  tools:
    name: Reference model & chaos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -v

      # A fixed seed range, not a random one: a seed is a replay recipe, and a
      # CI failure is only actionable if the same command reproduces it. Bumping
      # the range is a deliberate commit, never a per-run roll of the dice.
      - name: Deterministic chaos run
        run: python3 tools/eko_harness.py chaos --seed 20260724 --runs 100 --steps 2000 --pairings 4

      - name: Framed loopback exchange
        run: |
          python3 tools/eko_harness.py simulate --events 12 --gap-through 3
          python3 tools/eko_harness.py simulate --truncate-at 7

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate, before anything executes the wrapper: reject a
      # tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: android

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: eko-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned so a runner-image bump can't change the toolchain. Keep in
          # step with macos/project.yml's `xcodeVersion` and with the Swift 6.1
          # tools version in macos/Package.swift.
          xcode-version: "16.3"

      - name: Install XcodeGen
        run: brew install xcodegen

      # The repo's own gate, unmodified: regenerate the project from
      # project.yml, lint the plist and entitlements, run the package tests,
      # then the app-hosted project tests. Running the documented local command
      # rather than a CI-only reimplementation is the point — the two can't drift.
      - name: Verify (generate, lint, package tests, project tests)
        run: ./Scripts/verify-macos.sh
        working-directory: macos
